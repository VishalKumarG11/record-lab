<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Record-lab Studio</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      :root {
        --bg-main: #0c0e14;
        --bg-panel: #131722;
        --bg-subtle: #1c2233;
        --border-color: #262e42;
        --text-primary: #f8fafc;
        --text-muted: #8492a6;
        --accent-blue: #3b82f6;
        --accent-purple: #a855f7;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* 1. TOP NAVBAR */
      .top-navbar {
        height: 48px;
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        flex-shrink: 0;
        z-index: 30;
      }

      .top-left-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .icon-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 6px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        font-size: 14px;
      }
      .icon-btn:hover {
        background: var(--bg-subtle);
        color: var(--text-primary);
      }

      .project-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        color: #cbd5e1;
        background: var(--bg-subtle);
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid var(--border-color);
      }
      .project-pill .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--accent-blue);
      }

      .top-right-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .action-pill-btn {
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #recordBtn {
        background: #ef4444;
        color: white;
        border: none;
      }
      #recordBtn:hover:not(:disabled) { background: #dc2626; }
      #recordBtn:disabled { background: #334155; opacity: 0.6; cursor: not-allowed; }

      #stopBtn {
        background: var(--bg-subtle);
        color: #f1f5f9;
      }
      #stopBtn:hover:not(:disabled) { background: #2e3852; }
      #stopBtn:disabled { opacity: 0.4; cursor: not-allowed; }

      #exportBtn {
        background: var(--accent-blue);
        color: white;
        border: none;
        padding: 7px 18px;
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
      }
      #exportBtn:hover:not(:disabled) { background: #2563eb; }
      #exportBtn:disabled { background: #334155; opacity: 0.5; box-shadow: none; cursor: not-allowed; }

      .select-clean {
        background: var(--bg-subtle);
        color: #cbd5e1;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 500;
        outline: none;
        cursor: pointer;
      }

      /* 2. MAIN WORKSPACE */
      .app-workspace {
        display: flex;
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      /* Left Tool Dock */
      .tool-dock {
        width: 52px;
        background: var(--bg-panel);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 0;
        gap: 12px;
        z-index: 25;
        flex-shrink: 0;
      }

      .dock-item {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.15s;
        font-size: 16px;
      }
      .dock-item:hover {
        color: var(--text-primary);
        background: var(--bg-subtle);
      }
      .dock-item.active {
        color: var(--accent-blue);
        background: rgba(59, 130, 246, 0.15);
      }

      /* Collapsible Inspector Drawer / Modal */
      .inspector-card {
        position: absolute;
        top: 14px;
        left: 64px;
        width: 270px;
        background: rgba(19, 23, 34, 0.96);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65);
        padding: 14px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: opacity 0.2s, transform 0.2s;
      }
      .inspector-card.hidden {
        opacity: 0;
        pointer-events: none;
        transform: translateX(-8px);
      }

      .inspector-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 8px;
      }
      .inspector-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        text-transform: uppercase;
      }

      .theme-picker-grid {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .color-dot {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        transition: transform 0.15s;
      }
      .color-dot:hover { transform: scale(1.15); }
      .color-dot.active {
        border-color: #ffffff;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      }

      .color-picker-wrapper {
        position: relative;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid #475569;
        background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .color-picker-wrapper input[type="color"] {
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        position: absolute;
      }

      .upload-btn {
        width: 100%;
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        color: #cbd5e1;
        background: var(--bg-subtle);
        border: 1px dashed var(--border-color);
        padding: 7px;
        border-radius: 6px;
        cursor: pointer;
      }
      .upload-btn:hover { background: #262f47; }

      /* Responsive Center Stage */
      .center-stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 44px 20px 16px 20px;
        background: radial-gradient(circle at center, #151926 0%, #0c0e14 100%);
        overflow: hidden;
      }

      /* Stage Toolbar: Centered at Top */
      .stage-toolbar {
        position: absolute;
        top: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(19, 23, 34, 0.9);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 4px 14px;
        backdrop-filter: blur(12px);
        z-index: 10;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      }
      .stage-toolbar select {
        background: transparent;
        color: #f1f5f9;
        font-size: 13px;
        font-weight: 600;
        border: none;
        outline: none;
        cursor: pointer;
      }
      .crop-indicator {
        font-size: 12px;
        color: var(--text-muted);
        border-left: 1px solid var(--border-color);
        padding-left: 8px;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* Responsive Aspect-Ratio Container */
      .canvas-viewport-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .canvas-container {
        position: relative;
        max-width: 90%;
        max-height: 90%;
        aspect-ratio: 16 / 9;
        height: auto;
        width: auto;
        border-radius: 16px;
        background: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #d946ef 100%);
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 22px;
        box-sizing: border-box;
        transition: aspect-ratio 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }

      /* Inner Window: Clean Border Radius, Window Header Removed */
      .mockup-window {
        width: 100%;
        height: 100%;
        background-color: #000;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .screen-viewport {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #zoomCanvas {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        cursor: pointer;
      }

      /* 3. BOTTOM TIMELINE */
      .bottom-timeline-area {
        height: 140px;
        background: var(--bg-panel);
        border-top: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .timeline-transport {
        height: 38px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }

      .transport-center {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .timecode {
        font-family: monospace;
        font-size: 12px;
        color: var(--text-muted);
      }
      .play-btn-circle {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #f1f5f9;
        color: #090d16;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 11px;
        font-weight: bold;
      }
      .play-btn-circle:disabled { opacity: 0.4; cursor: not-allowed; }

      .timeline-tracks {
        flex: 1;
        position: relative;
        padding: 8px 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        background: #0d1017;
      }

      .timeline-ruler {
        height: 14px;
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #64748b;
        font-family: monospace;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .track-clip {
        height: 28px;
        background: linear-gradient(90deg, #2563eb 0%, #3b82f6 100%);
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        padding: 0 10px;
        font-size: 11px;
        font-weight: 600;
        color: white;
        gap: 6px;
      }

      .track-zoom-triggers {
        height: 24px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .zoom-badge {
        background: rgba(168, 85, 247, 0.25);
        border: 1px solid var(--accent-purple);
        color: #e9d5ff;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 5px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
    </style>
  </head>
  <body>
    <!-- 1. TOP NAVBAR -->
    <header class="top-navbar">
      <div class="top-left-actions">
        <button class="icon-btn" title="Undo">↶</button>
        <button class="icon-btn" title="Redo">↷</button>
        <div class="project-pill">
          <span class="status-dot"></span>
          <span>recording-lab-studio</span>
        </div>
      </div>

      <div class="top-right-actions">
        <select id="qualitySelect" class="select-clean" disabled>
          <option value="240">240p</option>
          <option value="360">360p</option>
          <option value="720">720p HD</option>
          <option value="1080" selected>1080p FHD</option>
          <option value="2160">2160p 4K</option>
        </select>

        <button id="recordBtn" class="action-pill-btn">● Start Recording</button>
        <button id="stopBtn" class="action-pill-btn" disabled>■ Stop & Preview</button>
        <button id="exportBtn" class="action-pill-btn" disabled>⬇ Export MP4</button>
        <span id="exportStatus" style="font-size: 12px; color: var(--text-muted); margin-left: 4px;"></span>
      </div>
    </header>

    <!-- 2. MAIN WORKSPACE -->
    <div class="app-workspace">
      <!-- Left Vertical Tool Dock -->
      <aside class="tool-dock">
        <div class="dock-item active" id="dockThemeBtn" title="Theme & Canvas">🎨</div>
        <div class="dock-item" title="Dynamic Cursor">↖</div>
        <div class="dock-item" title="Settings">⚙</div>
      </aside>

      <!-- Toggleable Inspector Drawer -->
      <div class="inspector-card" id="inspectorCard">
        <div class="inspector-header">
          <span class="inspector-title">Canvas Theme</span>
          <button class="icon-btn" id="closeInspectorBtn" style="padding: 2px 6px; font-size: 12px;">✕</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 11px; color: var(--text-muted);">Gradient Presets</span>
          <div class="theme-picker-grid">
            <button class="color-dot active" data-bg="linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #d946ef 100%)" style="background: linear-gradient(135deg, #38bdf8, #d946ef);"></button>
            <button class="color-dot" data-bg="linear-gradient(135deg, #f97316 0%, #ec4899 100%)" style="background: linear-gradient(135deg, #f97316, #ec4899);"></button>
            <button class="color-dot" data-bg="linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%)" style="background: linear-gradient(135deg, #06b6d4, #3b82f6);"></button>
            <button class="color-dot" data-bg="linear-gradient(135deg, #10b981 0%, #047857 100%)" style="background: linear-gradient(135deg, #10b981, #047857);"></button>
            <button class="color-dot" data-bg="#090d16" style="background: #18181b; border: 1px solid #3f3f46;"></button>

            <label class="color-picker-wrapper" title="Pick Custom Solid Color">
              <input type="color" id="designerColorPicker" value="#6366f1" />
            </label>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 11px; color: var(--text-muted);">Wallpaper Image</span>
          <label for="customBgUpload" class="upload-btn">📁 Choose Custom Image</label>
          <input type="file" id="customBgUpload" accept="image/*" style="display: none;" />
        </div>
      </div>

      <!-- Center Stage Area -->
      <main class="center-stage">
        <!-- Floating Aspect Ratio Toolbar -->
        <div class="stage-toolbar">
          <select id="aspectRatioSelect">
            <option value="16:9" selected>16:9</option>
            <option value="9:16">9:16</option>
            <option value="1:1">1:1</option>
            <option value="4:3">4:3</option>
          </select>
          <span class="crop-indicator">⛶ Fit Screen</span>
        </div>

        <!-- Fully Responsive Canvas Wrapper -->
        <div class="canvas-viewport-wrapper">
          <div class="canvas-container" id="canvasContainer">
            <div class="mockup-window">
              <div class="screen-viewport">
                <video id="preview" style="display: none;" playsinline></video>
                <canvas id="zoomCanvas"></canvas>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- 3. BOTTOM TIMELINE -->
    <footer class="bottom-timeline-area">
      <div class="timeline-transport">
        <div style="display: flex; gap: 6px;">
          <button class="icon-btn" title="Add Layer">+ Add Track</button>
          <button class="icon-btn" title="Split Clip">✂</button>
        </div>

        <div class="transport-center">
          <span class="timecode" id="currentTimecode">0:00</span>
          <button id="playPauseBtn" class="play-btn-circle" disabled title="Play / Pause">▶</button>
          <span class="timecode" id="totalTimecode">0:00</span>
        </div>

        <div style="font-size: 11px; color: var(--text-muted);">
          <span>Auto-Zoom Active</span>
        </div>
      </div>

      <div class="timeline-tracks">
        <div class="timeline-ruler">
          <span>0:00</span>
          <span>0:05</span>
          <span>0:10</span>
          <span>0:15</span>
          <span>0:20</span>
          <span>0:25</span>
          <span>0:30</span>
        </div>

        <div class="track-clip">
          <span>🎬</span>
          <span>Screen Recording Clip (Native Resolution)</span>
        </div>

        <div class="track-zoom-triggers">
          <span class="zoom-badge">🔍 Dynamic Zoom 1.32x</span>
          <span class="zoom-badge" style="opacity: 0.7;">🔍 Focus Lock</span>
        </div>
      </div>
    </footer>
  </body>
</html>
