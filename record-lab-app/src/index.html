<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Recordly Desktop</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #090d16;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 16px;
        min-height: 100vh;
      }
      h1 { font-size: 20px; margin-bottom: 12px; font-weight: 700; letter-spacing: -0.5px; }
      .controls { 
        margin-bottom: 16px; 
        display: flex; 
        gap: 12px; 
        align-items: center; 
      }
      button {
        padding: 9px 22px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      #recordBtn { background-color: #3b82f6; color: white; }
      #recordBtn:hover { background-color: #2563eb; }
      #recordBtn:disabled { background-color: #334155; cursor: not-allowed; opacity: 0.6; }
      
      #stopBtn { background-color: #ef4444; color: white; }
      #stopBtn:hover { background-color: #dc2626; }
      #stopBtn:disabled { background-color: #334155; cursor: not-allowed; opacity: 0.6; }

      /* Outer Aesthetic Wallpaper Canvas */
      .canvas-container {
        position: relative;
        width: 960px;
        height: 560px;
        border-radius: 20px;
        background: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #d946ef 100%);
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 34px;
      }

      /* Inner Window: Matches Screenshot 1 */
      .mockup-window {
        width: 100%;
        height: 100%;
        background-color: #0f172a;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 30px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.12);
        display: flex;
        flex-direction: column;
      }

      .window-header {
        height: 28px;
        background-color: #1e293b;
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 6px;
      }

      .dot { width: 9px; height: 9px; border-radius: 50%; }
      .dot-red { background-color: #ef4444; }
      .dot-yellow { background-color: #f59e0b; }
      .dot-green { background-color: #10b981; }

      .screen-viewport {
        position: relative;
        width: 100%;
        height: calc(100% - 28px);
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #zoomCanvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Recordly Studio</h1>
    <div class="controls">
      <button id="recordBtn">Start Recording</button>
      <button id="stopBtn" disabled>Stop & Preview</button>
    </div>

    <div class="canvas-container">
      <div class="mockup-window">
        <div class="window-header">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
        <div class="screen-viewport">
          <video id="preview" style="display: none;" playsinline></video>
          <canvas id="zoomCanvas"></canvas>
        </div>
      </div>
    </div>
  </body>
</html>
