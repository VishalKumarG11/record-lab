<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; media-src 'self' blob: data:; script-src 'self' 'unsafe-eval' 'unsafe-inline';">
    <title>Recordly Desktop</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      h1 { font-size: 24px; margin-bottom: 20px; }
      .controls { margin-bottom: 20px; display: flex; gap: 12px; }
      button {
        padding: 10px 20px;
        font-size: 15px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
      }
      #recordBtn { background-color: #3b82f6; color: white; }
      #recordBtn:hover { background-color: #2563eb; }
      #stopBtn { background-color: #ef4444; color: white; }
      #stopBtn:disabled { background-color: #475569; cursor: not-allowed; }
      video {
        width: 80%;
        max-width: 700px;
        border-radius: 12px;
        border: 2px solid #334155;
        background: #000;
      }
      #recordBtn:disabled {
      background-color: #475569;
      cursor: not-allowed;
      opacity: 0.6;
    }
    </style>
  </head>
  <body>
    <h1>Recordly Screen Recorder</h1>
    <div class="controls">
      <button id="recordBtn">Start Recording</button>
      <button id="stopBtn" disabled>Stop & Preview</button>
    </div>
    <video id="preview" controls></video>

    <!-- <script src="renderer.js"></script> -->
  </body>
</html>
