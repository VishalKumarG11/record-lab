<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Record-lab Desktop</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #090d16;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 16px;
        min-height: 100vh;
      }
      h1 { font-size: 20px; margin-bottom: 12px; font-weight: 700; letter-spacing: -0.5px; }
      .controls { 
        margin-bottom: 16px; 
        display: flex; 
        gap: 12px; 
        align-items: center; 
      }
      button {
        padding: 9px 22px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      #recordBtn { background-color: #3b82f6; color: white; }
      #recordBtn:hover { background-color: #2563eb; }
      #recordBtn:disabled { background-color: #334155; cursor: not-allowed; opacity: 0.6; }
      
      #stopBtn { background-color: #ef4444; color: white; }
      #stopBtn:hover { background-color: #dc2626; }
      #stopBtn:disabled { background-color: #334155; cursor: not-allowed; opacity: 0.6; }

      /* Outer Aesthetic Wallpaper Canvas */
      .canvas-container {
        position: relative;
        width: 960px;
        height: 560px;
        border-radius: 20px;
        background: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #d946ef 100%);
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px;
      }

      /* Inner Window: Matches Screenshot 1 */
      .mockup-window {
        width: 100%;
        height: auto;
        background-color: #0f172a;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 30px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.12);
        display: flex;
        flex-direction: column;
      }       

      #zoomCanvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #exportBtn { background-color: #10b981; color: white; }
      #exportBtn:hover { background-color: #059669; }
      #exportBtn:disabled { background-color: #334155; cursor: not-allowed; opacity: 0.6; }
      select {
        padding: 9px 14px;
        font-size: 14px;
        font-weight: 600;
        background-color: #1e293b;
        color: #f8fafc;
        border: 1px solid #334155;
        border-radius: 8px;
        cursor: pointer;
        outline: none;
      }
      select:disabled { opacity: 0.5; cursor: not-allowed; }
      .theme-picker {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #1e293b;
        padding: 5px 12px;
        border-radius: 10px;
        border: 1px solid #334155;
      }
      .color-dot {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
        transition: transform 0.15s, border-color 0.15s;
      }
      .color-dot:hover { transform: scale(1.15); }
      .color-dot.active {
        border-color: #ffffff;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
      }
      .upload-btn {
        font-size: 12px;
        font-weight: 600;
        color: #cbd5e1;
        background: #334155;
        padding: 5px 10px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .upload-btn:hover { background: #475569; }
      .color-picker-wrapper {
        position: relative;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        cursor: pointer;
        overflow: hidden;
        border: 2px solid #64748b;
        background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s, border-color 0.15s;
      }
      .color-picker-wrapper:hover {
        transform: scale(1.15);
        border-color: #ffffff;
      }
      .color-picker-wrapper input[type="color"] {
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        position: absolute;
        top: 0;
        left: 0;
      }
      /* Outer Frame: Selected Aspect Ratio me change hoga */
      .canvas-container {
        position: relative;
        width: 960px;
        height: 540px; /* Default 16:9 */
        border-radius: 20px;
        background: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #d946ef 100%);
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
       
        box-sizing: border-box;
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }

      /* Inner Window: Hamesha original 16:9 ratio lock rakhega (No Stretch) */
      .mockup-window {
        width: 100%;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 16 / 9; /* Lock original desktop ratio */
        background-color: #0f172a;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.12);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }    
      #zoomCanvas {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain; 
      }
    </style>
  </head>
  <body>
    <h1>Record-lab Studio</h1>
   <div class="controls">
      <button id="recordBtn">Start Recording</button>
      <button id="stopBtn" disabled>Stop & Preview</button>
      
      <!-- Quality Selector -->
      <select id="qualitySelect" disabled>
        <option value="240">240p</option>
        <option value="360">360p</option>
        <option value="720">720p HD</option>
        <option value="1080" selected>1080p FHD</option>
        <option value="2160">2160p 4K</option>
      </select>
         <!-- aspect ratio -->
      <select id="aspectRatioSelect">
        <option value="16:9" selected>16:9 (Horizontal)</option>
        <option value="9:16">9:16 (Vertical)</option>
        <option value="1:1">1:1 (Square)</option>
        <option value="4:3">4:3 (Classic)</option>
      </select>
      <!-- Background Swatches + Custom Color Picker -->
      <div class="theme-picker">
        <span style="font-size: 13px; color: #94a3b8; font-weight: 600;">Theme:</span>
        <button class="color-dot active" data-bg="linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #d946ef 100%)" style="background: linear-gradient(135deg, #38bdf8, #d946ef);"></button>
        <button class="color-dot" data-bg="linear-gradient(135deg, #f97316 0%, #ec4899 100%)" style="background: linear-gradient(135deg, #f97316, #ec4899);"></button>
        <button class="color-dot" data-bg="linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%)" style="background: linear-gradient(135deg, #06b6d4, #3b82f6);"></button>
        <button class="color-dot" data-bg="linear-gradient(135deg, #10b981 0%, #047857 100%)" style="background: linear-gradient(135deg, #10b981, #047857);"></button>
        <button class="color-dot" data-bg="#090d16" style="background: #18181b; border: 1px solid #3f3f46;"></button>
        
        <!-- Designer Color Picker -->
        <label class="color-picker-wrapper" title="Pick Designer Color">
          <input type="color" id="designerColorPicker" value="#6366f1" />
        </label>

        <label for="customBgUpload" class="upload-btn">Upload Image</label>
        <input type="file" id="customBgUpload" accept="image/*" style="display: none;" />
      </div>

      <button id="exportBtn" disabled>Export MP4</button>
      <span id="exportStatus" style="font-size: 13px; color: #94a3b8;"></span>
    </div>

    <div class="canvas-container">
      <div class="mockup-window">       
        <div class="screen-viewport">
          <video id="preview" style="display: none;" playsinline></video>
          <canvas id="zoomCanvas"></canvas>
        </div>
      </div>
    </div>
  </body>
</html>
